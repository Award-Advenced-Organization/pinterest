<div class="app">
  <!--barre-etat-->
  <header class="entete-accueil entete-mobile">
    <div class="entete-ligne">
      <span class="marque">USW<b>.</b></span>
      <span class="entete-actions">
        <button type="button" class="rond-verre verre verre-appuyable" aria-label="Rechercher"><svg class="ic"><use href="#i-loupe"/></svg></button>
        <button type="button" class="rond-verre verre verre-appuyable" aria-label="Notifications"><svg class="ic"><use href="#i-cloche"/></svg><span class="point-nouveau"></span></button>
      </span>
    </div>
    <nav class="flux mots" aria-label="Flux">
      <span class="m"><span style="--k:0">Découverte</span></span>
      <span class="m"><span style="--k:1">Abonnements</span></span>
      <span aria-current="true" class="m"><span style="--k:2">Près de moi</span></span>
    </nav>
    <div class="filtres">
      <button type="button" class="pastille verre verre-appuyable"><svg class="ic"><use href="#i-filtres"/></svg>Filtres</button>
      <button type="button" class="pastille verre verre-appuyable" aria-checked="true">Bénin<svg class="ic"><use href="#i-chevron-bas"/></svg></button>
      <button type="button" class="pastille verre verre-appuyable">Plages</button>
      <button type="button" class="pastille verre verre-appuyable">Nature</button>
      <button type="button" class="pastille verre verre-appuyable">À moins de 50 km</button>
    </div>
  </header>
  <main class="vide">
    <span class="etat-icone"><svg class="ic"><use href="#i-cible"/></svg></span>
    <h2>La position est désactivée</h2>
    <p>Pour voir les lieux autour de vous, autorisez la position. Vous pouvez aussi choisir une ville.</p>
    <div class="etat-actions"><button type="button" class="bouton-verre verre verre-appuyable large plein"><span class="bouton-verre-texte">Autoriser la position</span></button><button type="button" class="bouton-verre verre verre-appuyable large"><span class="bouton-verre-texte">Choisir une ville</span></button></div>
  </main>
  <!--onglets:accueil-->
</div>
