<div class="app fixe sombre montage">
  <!--barre-etat-->
  <div class="page-haut montage-haut">
    <button type="button" class="rond-verre givre verre verre-appuyable" aria-label="Retour"><svg class="ic"><use href="#i-retour"/></svg></button>
    <span class="page-haut-titre centre">Monter le reel</span>
    <button type="button" class="bouton-verre verre verre-appuyable plein petit"><span class="bouton-verre-texte">Suivant</span></button>
  </div>
  <div class="apercu-reel">
    <span class="photo ph-p15"></span>
    <span class="texte-reel">Avant 9 h, personne</span>

    <span class="temps-reel">0:07 / 0:28</span>

  <div class="outils">
    <button type="button" class="outil"><span class="outil-icone"><svg class="ic"><use href="#i-ciseaux"/></svg></span>Couper</button>

    <button type="button" class="outil"><span class="outil-icone"><svg class="ic"><use href="#i-retourner"/></svg></span>Réordonner</button>
    <button type="button" class="outil danger"><span class="outil-icone"><svg class="ic"><use href="#i-poubelle"/></svg></span>Supprimer</button>
  </div>
  <div class="frise">
    <span class="tete-lecture"></span>
    <div class="segment" style="--n:0;--l:11"><span class="photo ph-p15"></span><span class="segment-duree">11 s</span></div><div class="segment choisi" style="--n:1;--l:9"><span class="photo ph-p28"></span><span class="segment-duree">9 s</span></div><div class="segment" style="--n:2;--l:8"><span class="photo ph-p10"></span><span class="segment-duree">8 s</span></div>
  </div>
