  <!--onglets:accueil-->
  <script>
    // L en-tete se range quand on descend, et revient des qu on remonte.
    (function () {
      var entete = document.querySelector('.entete-mobile'), avant = scrollY
      addEventListener('scroll', function () {
        var y = scrollY
        if (Math.abs(y - avant) < 6) return
        entete.classList.toggle('range', y > avant && y > entete.offsetHeight)
        avant = y
      }, { passive: true })
    })()
  </script>
