<div class="app fixe sombre camera reel-camera">
  <span class="viseur photo ph-p15"></span>
  <!--barre-etat-->
  <div class="sequences" aria-label="Séquences filmées"><span style="--p:100%"></span><span style="--p:100%"></span><span class="encours" style="--p:46%"></span><span></span></div>
  <div class="camera-haut">
    <button type="button" class="rond-verre givre verre verre-appuyable" aria-label="Fermer"><svg class="ic"><use href="#i-fermer"/></svg></button>
    <span class="chrono"><span class="rec"></span>0:18 / 0:30</span>
    <button type="button" class="rond-verre givre verre verre-appuyable" aria-label="Minuteur"><svg class="ic"><use href="#i-minuteur"/></svg></button>
  </div>
  <div class="infos-prise">
    <span class="info-prise"><svg class="ic"><use href="#i-telephone"/></svg>Tecno Camon 50 Pro</span>
    <span class="info-prise"><svg class="ic"><use href="#i-lieu"/></svg>Cascade de Kota</span>
  </div>
  <div class="camera-bas">
    <div class="durees"><span>15 s</span><span aria-current="true">30 s</span><span>60 s</span></div>
    <div class="commandes-camera">
      <button type="button" class="rond-verre givre verre verre-appuyable" aria-label="Effacer la dernière séquence"><svg class="ic"><use href="#i-poubelle"/></svg></button>
      <button type="button" class="declencheur enregistre" aria-label="Arrêter la séquence"><span></span></button>
      <button type="button" class="bouton-verre verre verre-appuyable plein suivant-reel"><span class="bouton-verre-texte">Suivant</span></button>
    </div>
    <div class="modes"><span>Photo</span><span aria-current="true">Reel</span></div>
  </div>
</div>
