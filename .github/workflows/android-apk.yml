name: APK Android

# Compile l'APK de l'application mobile à chaque modification poussée sur la branche,
# ou à la demande depuis l'onglet Actions.
on:
  push:
    branches: [application-pinterest]
    paths:
      - 'pinterest_mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Adresse du backend vue depuis le téléphone (ex. http://192.168.1.20:3018)'
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pinterest_mobile
    env:
      # Ordre de priorité : saisie manuelle, variable du dépôt, IP du PC sur le Wi-Fi.
      API_URL: ${{ inputs.api_url || vars.PINTEREST_API_URL || 'http://10.78.162.130:3018' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --release --dart-define=API_URL=$API_URL

      - uses: actions/upload-artifact@v4
        with:
          name: pinterest-repro-apk
          path: pinterest_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
